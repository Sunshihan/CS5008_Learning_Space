<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS5008 Learning Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,800&family=Inter:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #faf7f2; /* Warm linen/oatmeal */
      color: #43302b; /* Soft chocolate brown */
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, .font-serif {
      font-family: 'Fraunces', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .font-hand {
      font-family: 'Dancing Script', cursive;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f3ede4;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4c3b3;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b8a08c;
    }
    .boho-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 195, 179, 0.5);
      box-shadow: 0 10px 30px -5px rgba(67, 48, 43, 0.05);
    }
    .soft-glow {
      box-shadow: 0 0 20px rgba(217, 119, 6, 0.1);
    }
    .grainy {
      position: relative;
    }
    .grainy::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 100;
    }
  </style>
